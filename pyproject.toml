[project]
name = "piphi-network-kaiterra-api"
version = "0.1.2"
description = "Piphi Network Kaiterra Api PiPhi integration runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.7.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
binary = [
  "pyinstaller>=6.10.0",
]

[project.scripts]
piphi_network_kaiterra_api = "piphi_network_kaiterra_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_kaiterra_api"]
